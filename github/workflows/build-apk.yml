
name: Build Offline AI Assistant APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OfflineAIAssistant"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.4.0" apply false
              id("org.jetbrains.kotlin.android") version "2.3.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.21" apply false
          }
          EOF

          mkdir -p app/src/main/java/com/offlineassistant/app

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.offlineassistant.app"
              compileSdk = 37

              defaultConfig {
                  applicationId = "com.offlineassistant.app"
                  minSdk = 24
                  targetSdk = 37
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.activity:activity-compose:1.12.0")
              implementation("androidx.compose.ui:ui:1.9.2")
              implementation("androidx.compose.ui:ui-tooling-preview:1.9.2")
              implementation("androidx.compose.material3:material3:1.4.0")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.9.3")
          }
          EOF

          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="Offline AI Assistant"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cp *.kt app/src/main/java/com/offlineassistant/app/

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.6.0

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Offline-AI-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
